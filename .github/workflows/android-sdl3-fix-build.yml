name: Android SDL3 startup fix build

on:
  push:
    branches:
      - fix/android-sdl3-startup-8.1.2
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: src/android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y glslang-tools zstd

      - name: Verify native toolchain
        run: |
          "$ANDROID_SDK_ROOT/cmake/3.31.6/bin/cmake" --version
          glslangValidator --version | head -n 3

      - name: Prime SDL3 3.4.8 cache with matching Android Java glue
        shell: bash
        run: |
          set -euo pipefail

          SDL_CI_VERSION='3.4.8-d57c3b685c'
          SDL_SOURCE_VERSION='release-3.4.8'
          SDL_SOURCE_SHA512='df5a323af7ac366661a3c0e887969c72584d232f3cc211419d59b0487b620b6b2859d4549c9e8df002ee489290062e466fcfddf7edc0872a37b1f2845e81c0f3'
          CACHE="$GITHUB_WORKSPACE/.cache/cpm/sdl3/${SDL_CI_VERSION}-android-aarch64"
          CI_TARBALL="$RUNNER_TEMP/SDL3-android-aarch64-${SDL_CI_VERSION}.tar.zst"
          SOURCE_TARBALL="$RUNNER_TEMP/SDL-${SDL_SOURCE_VERSION}.tar.gz"
          SOURCE_DIR="$RUNNER_TEMP/SDL-${SDL_SOURCE_VERSION}"

          rm -rf "$CACHE" "$SOURCE_DIR"
          mkdir -p "$CACHE" "$SOURCE_DIR"

          CI_URL="https://github.com/crueter-ci/SDL3/releases/download/v${SDL_CI_VERSION}/SDL3-android-aarch64-${SDL_CI_VERSION}.tar.zst"
          CI_SHA_URL="${CI_URL}.sha512sum"
          curl --fail --location --retry 5 --retry-all-errors "$CI_URL" --output "$CI_TARBALL"
          CI_SHA512="$(curl --fail --location --retry 5 --retry-all-errors "$CI_SHA_URL" | tr -d '[:space:]')"
          echo "${CI_SHA512}  ${CI_TARBALL}" | sha512sum --check --status
          tar --zstd -xf "$CI_TARBALL" -C "$CACHE"

          SOURCE_URL="https://github.com/libsdl-org/SDL/archive/${SDL_SOURCE_VERSION}.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" --output "$SOURCE_TARBALL"
          echo "${SDL_SOURCE_SHA512}  ${SOURCE_TARBALL}" | sha512sum --check --status
          tar -xzf "$SOURCE_TARBALL" -C "$SOURCE_DIR" --strip-components=1

          mkdir -p "$CACHE/java"
          cp -R "$SOURCE_DIR/android-project/app/src/main/java/." "$CACHE/java/"

          # CPMUtil's no-patch cache key is the literal string "none".
          printf 'none' > "$CACHE/.cpm_patch_key"

          test -f "$CACHE/CMakeLists.txt"
          test -f "$CACHE/java/org/libsdl/app/SDLActivity.java"
          grep -Fq 'SDL_MICRO_VERSION = 8' "$CACHE/java/org/libsdl/app/SDLActivity.java"
          echo "Prepared SDL3 native cache and exact 3.4.8 Android Java glue at $CACHE"

      - name: Build mainline release APK
        working-directory: src/android
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          set +e
          ./gradlew :app:assembleMainlineRelease --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-mainline-release.log"
          GRADLE_RC=${PIPESTATUS[0]}
          set -e

          echo "gradlew exit code: $GRADLE_RC"
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1 || true)"

          if [ "$GRADLE_RC" -ne 0 ]; then
            if grep -Fq 'BUILD SUCCESSFUL' "$RUNNER_TEMP/gradle-mainline-release.log" && [ -n "$APK" ] && [ -f "$APK" ]; then
              echo "::warning::Gradle returned $GRADLE_RC after BUILD SUCCESSFUL; APK exists at $APK, continuing to independent APK/DEX validation."
            else
              echo "::error::Gradle returned $GRADLE_RC without both BUILD SUCCESSFUL and a produced APK."
              exit "$GRADLE_RC"
            fi
          fi

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-mainline-release-log
          path: ${{ runner.temp }}/gradle-mainline-release.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find src/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Verify SDLActivity is packaged
        shell: bash
        run: |
          APK='${{ steps.apk.outputs.path }}'
          FOUND=0
          while IFS= read -r DEX; do
            if unzip -p "$APK" "$DEX" | strings | grep -Fq 'org/libsdl/app/SDLActivity'; then
              echo "Found org.libsdl.app.SDLActivity in $DEX"
              FOUND=1
              break
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          if [ "$FOUND" -ne 1 ]; then
            echo "::error::org.libsdl.app.SDLActivity is missing from the built APK"
            exit 1
          fi

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: STORM_SWITCH_8.1.2_SDL3_FIX
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
